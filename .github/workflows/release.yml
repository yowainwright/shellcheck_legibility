name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        uses: ./.github/actions/setup-shell

      - name: Validate
        run: make check

      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

  homebrew:
    name: Update Homebrew
    needs: release
    if: >-
      ${{ !cancelled() && !contains(github.ref_name, '-') &&
          (needs.release.result == 'success' ||
          (github.event_name == 'release' && !github.event.release.prerelease)) }}
    uses: yowainwright/homebrew-tap/.github/workflows/publish-formula.yml@main
    with:
      package: shellcheck-legibility
      tag: ${{ github.event.release.tag_name || github.ref_name }}
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
