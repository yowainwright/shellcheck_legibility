name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to Homebrew
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Require tap token
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Configure HOMEBREW_TAP_GITHUB_TOKEN before releasing."
            exit 1
          fi
          gh api --silent repos/yowainwright/homebrew-tap/git/ref/heads/main

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate source
        run: |
          make lint
          PATH=/usr/bin:/bin /bin/bash tests/unit/rules.bash

      - name: Package release assets
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          mkdir -p dist
          for target in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            ./scripts/package-release \
              "$VERSION" \
              "$target" \
              "dist/shellcheck-legibility-$target.tar.gz"
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --verify-tag --generate-notes

  homebrew:
    name: Open Homebrew formula PR
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    needs: release
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a vMAJOR.MINOR.PATCH release tag."
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft |
            jq -e '.isDraft == false' >/dev/null

      - name: Verify tap access
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh api --silent repos/yowainwright/homebrew-tap/git/ref/heads/main

      - name: Check out Homebrew tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yowainwright/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          ref: main
          persist-credentials: false
          path: homebrew-tap

      - name: Set up tap Ruby
        run: |
          brew list ruby >/dev/null 2>&1 || brew install ruby
          echo "$(brew --prefix ruby)/bin" >> "$GITHUB_PATH"

      - name: Update Homebrew formula
        working-directory: homebrew-tap
        run: |
          scripts/update-formula shellcheck-legibility "${RELEASE_TAG#v}"
          scripts/validate-tap --strict

      - name: Open Homebrew formula pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap
          add-paths: |
            Formula/shellcheck-legibility.rb
            brews/shellcheck-legibility.json
          base: main
          branch: shellcheck-legibility-${{ env.RELEASE_TAG }}
          commit-message: "shellcheck-legibility ${{ env.RELEASE_TAG }}"
          title: "shellcheck-legibility ${{ env.RELEASE_TAG }}"
          body: |
            Update the Homebrew formula to the published shellcheck-legibility release.

            Release: https://github.com/yowainwright/shellcheck_legibility/releases/tag/${{ env.RELEASE_TAG }}

            Generated from the published archives by the tap's shared scripts/update-formula.
            Merge after the tap's required validation passes.
