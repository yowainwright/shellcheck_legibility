name: Bug Report
description: Report incorrect diagnostics, missed diagnostics, crashes, or packaging problems.
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal Shell Sample
      description: Provide the smallest shell snippet that reproduces the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config
      description: Include the relevant config and command.
      render: toml
    validations:
      required: false
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include shellcheck-legibility, Bash, ShellCheck, and OS versions.
      placeholder: "shellcheck-legibility <version>, bash <version>, ShellCheck <version>, macOS"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
